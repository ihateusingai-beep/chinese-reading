<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7DD3FC">
<title>互動中文閱讀 · 點讀</title>
<style>
:root{
  --sky:#7DD3FC; --purple:#7c3aed; --gold:#f59e0b; --green:#22c55e; --red:#ef4444;
  /* 文字用嘅深色版本：#f59e0b 喺淺底只有 2.05:1，達唔到 WCAG 3:1（axe 會捉到） */
  --gold-ink:#b45309; --muted-ink:#64748b;
  --ink:#1f2937; --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0;
  --font-scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:calc(20px * var(--font-scale));
  line-height:1.8;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.6em;color:var(--gold-ink);text-align:center;margin:.2em 0 .6em}
button{
  font-size:1.4em;padding:18px 32px;border-radius:16px;border:none;
  min-height:70px;background:var(--sky);color:#0f172a;cursor:pointer;font-weight:700;
}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
#voice-banner{
  padding:14px 18px;border-radius:12px;margin-bottom:12px;font-weight:700;
  background:#fef3c7;color:#92400e;border:2px solid var(--gold);
}
#voice-banner[data-state="unsupported"]{background:#fee2e2;color:#991b1b;border-color:var(--red)}
#voice-banner[hidden]{display:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.muted{color:var(--muted-ink);font-size:.9em}

/* ---- 閱讀區（點讀）----
   ⚠️ 放大一定要用 transform: scale()，唔可以用 font-size ——
      改字級會觸發 reflow，成句字被推開，學生睇唔到自己撳咗邊個字。
      固定 width:1.15em 字格保證放大唔會蓋住隔籬字嘅可見筆畫。
   ⚠️ 多字詞 token（class 名見下面詞 token 規則）唔可以跟單字用固定 1.15em 闊度：
      3–4 字詞嘅內容（3–4 × 1em）會遠超容器 → 文字溢出、互相覆蓋，
      學生撳唔到被蓋住嘅字（Playwright 會判定「被遮擋」而 timeout）。
      → 詞 token 改用 width:auto（內容寬度），字格喺詞內逐字維護（每個 .g 都係 1.15em），
      咁每個字仍然對齊同一個網格，冇重疊，放大亦唔會推走隔籬字。 */
.tok{display:inline-block;width:1.15em;height:1.5em;line-height:1.5em;text-align:center;vertical-align:middle;border-radius:.18em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.tok .g{display:inline-block;transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .12s ease}
.g.on{transform:scale(1.45)}
.tok.on{background:#fef08a;outline:3px solid #f59e0b;outline-offset:1px}
.tok.word{width:auto;white-space:nowrap;box-shadow:inset 0 -0.12em 0 #7c3aed}
.tok.word .g{width:1.15em;text-align:center}
.tok.word.on{background:#ddd6fe;outline-color:#7c3aed}
.g.deep{color:#7c3aed;font-weight:700}
.tok.punct{color:var(--muted-ink)}
.reading{font-size:calc(48px * var(--font-scale));margin:12px 0;word-break:break-all}
#read-card{margin-top:12px;padding:8px 14px;border-radius:12px;background:#fff;border:2px dashed var(--sky);font-size:.9em;font-weight:700;display:inline-block}
#read-card[hidden]{display:none}
/* 減少動態：關閉彈跳動畫，但保留放大（放大係資訊，唔係裝飾） */
@media (prefers-reduced-motion: reduce){.tok .g{transition:none}}

/* ---- 老師端：標詞配對 ---- */
.teacher-text{font-size:calc(34px * var(--font-scale));margin:10px 0;line-height:1.9}
.t-char{display:inline-block;width:1.15em;line-height:1.6em;text-align:center;border-radius:.16em;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.t-char.punct{color:var(--muted-ink)}
.t-char.pending{background:#7DD3FC;outline:3px solid #0284c7;outline-offset:1px}
.t-word{display:inline-block;background:#ddd6fe;border-radius:.16em;outline:2px solid #7c3aed;outline-offset:1px}
.t-word .t-char{width:auto;padding:0 .06em;cursor:pointer}
.teacher-hint{color:#0369a1;font-weight:700;min-height:1.6em}
.teacher-warn{background:#fef3c7;color:#92400e;border:2px solid var(--gold-ink);border-radius:12px;padding:8px 12px;font-weight:700;margin:8px 0}
.teacher-warn[hidden]{display:none}
.teacher-panel{background:#eef2ff;border:2px solid var(--purple);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.teacher-panel[hidden]{display:none}
.teacher-words{margin-top:12px}
.word-row{display:flex;gap:10px;align-items:center;margin:6px 0}
.word-text{font-size:1.3em;font-weight:700;background:#ede9fe;border-radius:10px;padding:4px 12px}
.word-del{min-height:70px;font-size:1em;padding:6px 14px;background:#fee2e2;color:#991b1b}

/* ---- Hub（學生端首頁）：大卡片、大掣 ---- */
.hub{display:flex;flex-direction:column;gap:14px}
.article-card{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--sky);color:var(--ink);padding:18px 20px;min-height:96px}
.article-card .t-title{display:block;font-size:1.6em;color:var(--purple)}
.article-card .t-meta{display:block;font-size:.85em;color:var(--muted-ink);font-weight:700;margin-top:4px}
.badge{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:999px;padding:2px 12px;font-size:.75em;font-weight:700}
.hub-foot{margin-top:18px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center}

/* ---- 頂 bar / 底部工具列 ---- */
.topbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.topbar .t-title{font-size:1.5em;font-weight:700;color:var(--purple);flex:1 1 auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.toolbar button{flex:1 1 120px}
.btn-ghost{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn-purple{background:var(--purple);color:#fff}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- 老師端 ---- */
.article-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:2px solid var(--line)}
.article-row .t-title{flex:1 1 140px;font-size:1.2em;font-weight:700}
.article-row button{min-height:70px;font-size:1em;padding:8px 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:70px;font-size:1.1em;padding:10px 18px}
.tabs button[aria-selected="true"]{background:var(--purple);color:#fff}
.setting-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.setting-row label{font-weight:700;min-width:8em}
.setting-row input[type=range]{flex:1 1 200px;min-height:48px}
.setting-row .v{min-width:4em;font-weight:700;color:var(--purple)}
textarea{width:100%;min-height:160px;font-size:1.1em;font-family:inherit;padding:12px;border:2px solid var(--line);border-radius:12px}
input[type=text],input[type=password]{width:100%;min-height:70px;font-size:1.2em;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
/* 下拉框：老師用大手指揀類型，太細撳唔中 → 同其他輸入框一樣 ≥70px */
select{width:100%;max-width:340px;min-height:70px;font-size:1.2em;padding:8px 12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;background:var(--card);color:var(--ink)}
.field-label{display:block;font-weight:700;margin-top:12px}
.modal-input{width:100%;min-height:70px;font-size:1.2em;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-top:10px;font-family:inherit}

/* ---- Toast / Modal（SEN 原則：唔可以用 alert() / confirm()）---- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:min(520px,92vw)}
.modal-title{font-size:1.4em;margin:0 0 8px;color:var(--gold-ink)}
.modal-actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.modal-actions button{flex:1 1 140px}
.modal-cancel{background:#e2e8f0;color:#1f2937}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 互動中文閱讀</h1>
  <div id="voice-banner" hidden role="status" aria-live="polite"></div>
  <div id="app"><p class="muted">載入中…</p></div>
</div>

<script>
'use strict';

window.__BUILD_ID = 'chinese-reading @ 2026-11-10';
// 內容版本 —— 每加一批預設文章就 +1。
// 用嚟決定「要唔要補新嘅預設文章俾已經用緊嘅裝置」：
//   已存版本 >= SEED_VERSION → 唔會再動（老師刪咗嘅預設文章唔會復活）
//   已存版本 <  SEED_VERSION → 只補 seedVersion 大過已存版本嘅文章（唔會覆蓋老師改過嘅）
const SEED_VERSION = 2;

// 粵語預設語速（中度學生要比正常慢）—— 單一真相來源
const DEFAULT_SPEECH_RATE = 0.75;

// 字級控制（單一真相來源）
// ⚠️ 細步 5%：中度學生對字級好敏感，10% 一跳大細差好多
const FONT_SCALE_MIN = 0.7;
const FONT_SCALE_MAX = 2;
const FONT_SCALE_STEP = 0.05;
// 老師常用嘅預設字級（一撳就跳到，唔使慢慢拖 slider）
const FONT_PRESETS = [
  { label: '細', value: 0.85 },
  { label: '標準', value: 1 },
  { label: '大', value: 1.3 },
  { label: '特大', value: 1.7 },
];

// ==================== STORE ====================
// localStorage 層：全部 key 用 cr* 前綴，唔會撞 reading-para 嘅 yue*
const Store = {
  KEY_ARTICLES: 'crArticles',
  KEY_SCHEMA: 'crSchemaVersion',
  KEY_SETTINGS: 'crSettings',
  KEY_PROGRESS: 'crProgress',
  KEY_TEACHER_PASS: 'crTeacherPassHash',
  settings: {
    rate: DEFAULT_SPEECH_RATE,
    fontScale: 1,
    wordPriority: true,
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY_SETTINGS);
      if (raw) {
        const parsed = JSON.parse(raw);
        this.settings = Object.assign({}, this.settings, parsed);
      }
    } catch (e) {
      // 壞 JSON / 私隱模式 → 用預設值，唔好 crash
      this.settings = { rate: DEFAULT_SPEECH_RATE, fontScale: 1, wordPriority: true };
    }
    return this.settings;
  },
  saveSettings() {
    try {
      localStorage.setItem(this.KEY_SETTINGS, JSON.stringify(this.settings));
    } catch (e) {
      // quota 滿 / 私隱模式 → 靜靜 skip，唔好 crash
    }
  },

  // ---- 文章庫 ----
  getArticles() {
    try {
      const raw = localStorage.getItem(this.KEY_ARTICLES);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];          // 壞 JSON → 當空，唔好 crash
    }
  },
  saveArticles(list) {
    try {
      localStorage.setItem(this.KEY_ARTICLES, JSON.stringify(Array.isArray(list) ? list : []));
      return true;
    } catch (e) {
      return false;       // quota 滿
    }
  },
  addArticle(article) {
    const list = this.getArticles();
    list.push(article);
    this.saveArticles(list);
    return article;
  },
  removeArticle(id) {
    this.saveArticles(this.getArticles().filter(a => a.id !== id));
  },
  getArticle(id) {
    return this.getArticles().find(a => a.id === id) || null;
  },

  // ---- 進度（極簡：讀過幾多次、上次幾時讀）----
  getProgress() {
    try {
      const raw = localStorage.getItem(this.KEY_PROGRESS);
      const obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
    } catch (e) {
      return {};            // 壞 JSON → 當空，唔好 crash
    }
  },
  bumpProgress(id) {
    if (!id) return null;
    const p = this.getProgress();
    const cur = (p[id] && typeof p[id] === 'object') ? p[id] : {};
    const next = { reads: (Number(cur.reads) || 0) + 1, lastAt: new Date().toISOString() };
    p[id] = next;
    try {
      localStorage.setItem(this.KEY_PROGRESS, JSON.stringify(p));
    } catch (e) {
      // quota 滿 → 進度記唔住唔要緊，唔好 crash
    }
    return next;
  },

  // ---- 預設文章（第一次開 app 時植入）----
  // ⚠️ offset 係 code-point index（Array.from），唔係 UTF-16。
  //    手寫好易錯 → 用 script 計好再貼入，唔好靠肉眼。
  // ⚠️ 呢啲係**短篇**（35–40 字）：中度學生注意力短，長句會攰。
  //    老師可以自己貼更長嘅文章（見 Teacher 新增文章）。
  SEED_ARTICLES: [
    {
      id: 'a_seed_1', seedVersion: 1, createdAt: '2026-01-01T00:00:00.000Z', title: '去茶餐廳', type: 'life',
      text: '我今天和爸爸媽媽去了茶餐廳吃飯。我們叫了兩杯奶茶和一個菠蘿包。爸爸說明天再來。',
      words: [
        { start: 6, len: 2, text: '媽媽' },
        { start: 10, len: 3, text: '茶餐廳' },
        { start: 13, len: 2, text: '吃飯' },
        { start: 22, len: 2, text: '奶茶' },
        { start: 27, len: 3, text: '菠蘿包' },
        { start: 34, len: 2, text: '明天' },
      ],
    },
    {
      id: 'a_seed_2', seedVersion: 1, createdAt: '2026-01-01T00:00:00.000Z', title: '去公園', type: 'life',
      text: '星期天早上，爸爸帶我去公園。我們看到很多小鳥和大樹。我在公園跑了很多圈。',
      words: [
        { start: 0, len: 3, text: '星期天' },
        { start: 6, len: 2, text: '爸爸' },
        { start: 11, len: 2, text: '公園' },
        { start: 20, len: 2, text: '小鳥' },
        { start: 23, len: 2, text: '大樹' },
      ],
    },
    {
      id: 'a_seed_3', seedVersion: 1, createdAt: '2026-01-01T00:00:00.000Z', title: '小雨人', type: 'poem',
      text: '小雨滴，滴答滴答落。下雨了，我要帶遮。媽媽說，等雨停了，我們就去公園。',
      words: [
        { start: 0, len: 3, text: '小雨滴' },
        { start: 4, len: 2, text: '滴答' },
        { start: 10, len: 2, text: '下雨' },
        { start: 16, len: 2, text: '帶遮' },
        { start: 32, len: 2, text: '公園' },
      ],
    },
    {
      id: 'a_seed_4', seedVersion: 1, createdAt: '2026-01-01T00:00:00.000Z', title: '生日', type: 'life',
      text: '今日是我的生日。媽媽買了一個大蛋糕，全家人一起唱生日歌。我吹熄了蠟燭。',
      words: [
        { start: 5, len: 2, text: '生日' },
        { start: 8, len: 2, text: '媽媽' },
        { start: 15, len: 2, text: '蛋糕' },
        { start: 24, len: 3, text: '生日歌' },
        { start: 32, len: 2, text: '蠟燭' },
      ],
    },
    {
      // 課文《到餐廳去》（2026-11-10 老師提供）—— 55 字、13 個重點詞
      id: 'a_seed_5', seedVersion: 2, createdAt: '2026-11-10T00:00:00.000Z', title: '到餐廳去', type: 'prose',
      text: '爸爸媽媽帶我們到餐廳去。爸爸喝咖啡，媽媽吃三文治。姐姐喝橙汁，我吃炒蛋。妹妹喝了汽水，呼了一口氣，大家笑哈哈！',
      words: [
        { start: 0, len: 4, text: '爸爸媽媽' },
        { start: 5, len: 2, text: '我們' },
        { start: 8, len: 2, text: '餐廳' },
        { start: 12, len: 2, text: '爸爸' },
        { start: 15, len: 2, text: '咖啡' },
        { start: 18, len: 2, text: '媽媽' },
        { start: 21, len: 3, text: '三文治' },
        { start: 25, len: 2, text: '姐姐' },
        { start: 28, len: 2, text: '橙汁' },
        { start: 33, len: 2, text: '炒蛋' },
        { start: 36, len: 2, text: '妹妹' },
        { start: 40, len: 2, text: '汽水' },
        { start: 51, len: 3, text: '笑哈哈' },
      ],
    },
  ],

  /**
   * 植入／補上預設文章。
   *
   * ⚠️ 語意（呢個係好易搞錯嘅地方）：
   *   1. **全新安裝**（`crArticles` 唔存在）→ 植入全部預設文章
   *   2. **已經用緊嘅裝置** → **只補上新增嗰批**（`seedVersion > 已存版本`），
   *      老師自己加嘅文章、佢改過嘅內容、佢刪咗嘅舊預設文章，**全部唔會被掂**
   *   3. **版本已經係最新** → 乜都唔做（老師清空咗文章庫都唔會自動生返）
   *
   * @returns {boolean} 有冇動過文章庫
   */
  seedDefaults() {
    let storedVer = 0;
    try {
      storedVer = Number(localStorage.getItem(this.KEY_SCHEMA)) || 0;
    } catch (e) {
      return false;          // 私隱模式 → 唔好 crash
    }
    if (storedVer >= SEED_VERSION) return false;

    let raw = null;
    try {
      raw = localStorage.getItem(this.KEY_ARTICLES);
    } catch (e) {
      return false;
    }

    if (raw === null) {
      // 全新安裝 → 植入全部
      this.saveArticles(this.SEED_ARTICLES.map(a => this._cloneSeed(a)));
    } else {
      // 已有文章庫 → 只補新增嗰批
      const list = this.getArticles();
      const have = new Set(list.map(a => a.id));
      let added = 0;
      for (const a of this.SEED_ARTICLES) {
        if (have.has(a.id)) continue;
        if ((a.seedVersion || 1) <= storedVer) continue;   // 舊批次 → 唔好復活
        list.push(this._cloneSeed(a));
        added++;
      }
      if (added) this.saveArticles(list);
    }

    try {
      localStorage.setItem(this.KEY_SCHEMA, String(SEED_VERSION));
    } catch (e) {
      // 寫唔到版本號唔要緊（下次會再試一次）
    }
    return true;
  },

  _cloneSeed(a) {
    return {
      id: a.id,
      title: a.title,
      type: a.type,
      text: a.text,
      words: a.words.map(w => ({ start: w.start, len: w.len, text: w.text })),
      createdAt: a.createdAt || '2026-01-01T00:00:00.000Z',
      published: true,
      seedVersion: a.seedVersion || 1,
    };
  },
};

// ==================== SHA-256 ====================
// 純 JS SHA-256（**唔靠** `crypto.subtle`）。
//
// ⚠️ 點解唔可以用 `crypto.subtle`：
//   1. `crypto.subtle` 只喺 **secure context**（https:// 或 localhost）先有
//      → 學校用 `http://192.168.x.x` 開嘅本機伺服器**完全冇** → 密碼 gate 死掉
//   2. jsdom 測試環境冇 `window.crypto.subtle`
//   3. 舊 iPad Safari (< 11) 冇
//   → 自己實作，約 60 行、零依賴，任何環境都跑得。
//
// 參考：FIPS 180-4。實作後有用 Node crypto 對過測試向量（見 tests/t11-auth.test.js）。
const Sha256 = {
  // 64 個 round constant = 前 64 個質數嘅立方根小數部分 × 2^32
  K: [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ],

  _rotr(x, n) {
    return (x >>> n) | (x << (32 - n));
  },

  /** UTF-8 編碼（手寫，唔靠 TextEncoder —— 舊瀏覽器/測試環境唔一定有） */
  _utf8(str) {
    const out = [];
    const s = String(str === null || str === undefined ? '' : str);
    for (const ch of Array.from(s)) {          // Array.from = code point（emoji 唔會拆爛）
      const cp = ch.codePointAt(0);
      if (cp < 0x80) {
        out.push(cp);
      } else if (cp < 0x800) {
        out.push(0xc0 | (cp >> 6), 0x80 | (cp & 0x3f));
      } else if (cp < 0x10000) {
        out.push(0xe0 | (cp >> 12), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
      } else {
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
      }
    }
    return out;
  },

  /** @returns {string} 64 個 hex 字符 */
  hash(msg) {
    const H = [
      0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
      0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
    ];
    const bytes = this._utf8(msg);
    const bitLen = bytes.length * 8;

    bytes.push(0x80);                                  // 1 bit嘅「1」
    while (bytes.length % 64 !== 56) bytes.push(0);    // 補 0 到 56 bytes
    const hi = Math.floor(bitLen / 4294967296);        // 64-bit 長度（大端）
    const lo = bitLen >>> 0;
    bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255);
    bytes.push((lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);

    const w = new Array(64);
    for (let off = 0; off < bytes.length; off += 64) {
      for (let i = 0; i < 16; i++) {
        const j = off + i * 4;
        w[i] = (bytes[j] << 24) | (bytes[j + 1] << 16) | (bytes[j + 2] << 8) | bytes[j + 3];
      }
      for (let i = 16; i < 64; i++) {
        const x = w[i - 15];
        const y = w[i - 2];
        const s0 = this._rotr(x, 7) ^ this._rotr(x, 18) ^ (x >>> 3);
        const s1 = this._rotr(y, 17) ^ this._rotr(y, 19) ^ (y >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }

      let a = H[0], b = H[1], c = H[2], d = H[3];
      let e = H[4], f = H[5], g = H[6], h = H[7];

      for (let i = 0; i < 64; i++) {
        const S1 = this._rotr(e, 6) ^ this._rotr(e, 11) ^ this._rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + this.K[i] + w[i]) | 0;
        const S0 = this._rotr(a, 2) ^ this._rotr(a, 13) ^ this._rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h = g; g = f; f = e;
        e = (d + t1) | 0;
        d = c; c = b; b = a;
        a = (t1 + t2) | 0;
      }

      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }

    let out = '';
    for (let i = 0; i < 8; i++) out += ('00000000' + (H[i] >>> 0).toString(16)).slice(-8);
    return out;
  },
};

// ==================== AUTH ====================
// 老師端密碼 gate（SHA-256 + 每次安裝隨機 salt）。
//
// ⚠️ 呢個**唔係真安全**：目標係阻擋學生誤入老師模式（改咗文章），
//    唔係防 Hacking（localStorage 本来就係明文可讀，前端 hash 只係唔好咁容易撞見）。
//    真正嘅安全要靠後端，呢個專案係零 backend。
const Auth = {
  // 學校老師密碼（2026-11-10 老師指定）。⚠️ 唔同 sibling `reading-para` 嘅 Hcwmc
  DEFAULT_PASS: '230714',
  MIN_PASS_LEN: 5,
  _teacher: false,          // 老師模式開關（只喺呢個分頁有效）

  isTeacher() { return this._teacher; },
  setTeacher(on) { this._teacher = !!on; },

  _randomSalt() {
    const bytes = new Uint8Array(16);
    let ok = false;
    try {
      if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
        window.crypto.getRandomValues(bytes);
        ok = true;
      }
    } catch (e) {
      ok = false;
    }
    if (!ok) {
      for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    let hex = '';
    for (let i = 0; i < bytes.length; i++) hex += ('0' + bytes[i].toString(16)).slice(-2);
    return hex;
  },

  /** salt + '|' + 密碼 → hash（同步！純 JS 唔使 async） */
  hash(pass, salt) {
    return Sha256.hash(String(salt || '') + '|' + String(pass === null || pass === undefined ? '' : pass));
  },

  /** 讀取密碼紀錄 { salt, hash }；冇或者壞咗就重新產生（用預設密碼） */
  ensureSeeded() {
    let raw = null;
    try {
      raw = localStorage.getItem(Store.KEY_TEACHER_PASS);
    } catch (e) {
      // 私隱模式 → 下面照樣可以用（記憶體內）
    }
    if (raw) {
      try {
        const rec = JSON.parse(raw);
        if (rec && typeof rec.salt === 'string' && typeof rec.hash === 'string') return rec;
      } catch (e) {
        // 壞 JSON → 重新產生
      }
    }
    const salt = this._randomSalt();
    const rec = { salt: salt, hash: this.hash(this.DEFAULT_PASS, salt) };
    try {
      localStorage.setItem(Store.KEY_TEACHER_PASS, JSON.stringify(rec));
    } catch (e) {
      // 存唔到（例如私隱模式）→ 記憶體內仍然生效
    }
    return rec;
  },

  /** 密碼啱唔啱 */
  check(pass) {
    if (typeof pass !== 'string' || !pass) return false;
    const rec = this.ensureSeeded();
    return this.hash(pass, rec.salt) === rec.hash;
  },

  /** 改密碼（最少 MIN_PASS_LEN 個字元） */
  changePassword(newPass) {
    if (typeof newPass !== 'string' || newPass.length < this.MIN_PASS_LEN) {
      return { ok: false, error: `密碼最少要 ${this.MIN_PASS_LEN} 個字元` };
    }
    const salt = this._randomSalt();
    const rec = { salt: salt, hash: this.hash(newPass, salt) };
    try {
      localStorage.setItem(Store.KEY_TEACHER_PASS, JSON.stringify(rec));
    } catch (e) {
      return { ok: false, error: '存唔到密碼（可能係私隱模式）' };
    }
    return { ok: true };
  },

  /**
   * in-app 密碼輸入。
   * @returns {Promise<{ok:boolean, cancelled:boolean}>}
   *   cancelled = true → 老師撳咗「取消」（唔應該提示「密碼唔啱」）
   *   ok = false, cancelled = false → 密碼錯
   */
  async askPassword(title = '🔐 老師模式') {
    const pass = await Modal.askText({
      title: title,
      label: '請輸入老師密碼',
      placeholder: '密碼',
      password: true,
      okText: '進入',
      cancelText: '取消',
    });
    if (pass === null || pass === undefined) return { ok: false, cancelled: true };
    if (!this.check(pass)) return { ok: false, cancelled: false };
    this.setTeacher(true);
    return { ok: true, cancelled: false };
  },
};

// ==================== VOICE ====================
// 粵語發音層（Web Speech API, zh-HK）
// 設計依據：docs/DESIGN.md §5.5
const Voice = {
  state: 'unknown',      // unknown | ok | no-hk | unsupported
  voice: null,
  all: [],
  rate: DEFAULT_SPEECH_RATE,
  seqGen: 0,             // generation counter：作廢上一輪嘅所有回調

  async init() {
    if (!('speechSynthesis' in window)) { this.state = 'unsupported'; return this.state; }
    const pick = () => {
      this.all = window.speechSynthesis.getVoices() || [];
      this.voice =
        this.all.find(v => /^zh[-_]HK/i.test(v.lang)) ||
        this.all.find(v => /hong ?kong|cantonese|粵|粤/i.test(v.name)) ||
        null;
      this.state = this.voice ? 'ok' : (this.all.length ? 'no-hk' : 'unknown');
      return this.state;
    };

    pick();
    if (this.state === 'ok') return 'ok';

    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        pick();
        if (this.state === 'unknown') this.state = 'no-hk';
        resolve(this.state);
      };
      window.speechSynthesis.addEventListener('voiceschanged', finish, { once: true });
      setTimeout(finish, 1500);
    });
  },

  speak(text, { rate = this.rate, pitch = 1, onend, onerror } = {}) {
    const gen = ++this.seqGen;          // 先遞增：令上一輪嘅回調即刻失效
    if (!text) { onend?.(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK';
    if (this.voice) u.voice = this.voice;
    u.rate = rate;
    u.pitch = pitch;
    u.onend = () => {
      if (gen !== this.seqGen) return;  // 已被新一輪取代 → 唔推進
      onend?.();
    };
    u.onerror = (e) => {
      if (gen !== this.seqGen) return;  // 被取消 → 唔推進（DESIGN §5.5.2 T8）
      onerror?.(e);
      onend?.();                        // 必須推進，否則串行卡死喺第一個字（DESIGN §5.5.2 T2）
    };
    window.speechSynthesis.speak(u);
  },

  stop() {
    this.seqGen++;                      // 作廢所有進行中嘅回調
    window.speechSynthesis.cancel();
  },
};

// ==================== TOKENIZER ====================
// text + words → token 陣列（渲染同發音共用同一份 truth）
// 設計依據：docs/DESIGN.md §4.1 / §4.2
const Tokenizer = {
  // 標點：唔發音，只做停頓（讀全篇時嘅呼吸位）
  PUNCT: new Set('，。！？、；：…—「」『』（）《》〈〉,.!?;:"\''),

  // 詞失效嘅原因（俾老師端顯示）
  REASON_TEXT: {
    'invalid-params': '詞嘅位置資料唔啱',
    'out-of-range': '詞超出文章範圍',
    'offset-mismatch': '文章改咗，呢個詞要重新配對',
    'contains-punctuation': '詞入面唔可以有標點',
    'overlap': '呢個詞同另一個詞重疊咗',
  },

  /**
   * 攞 code-point 陣列。
   * ⚠️ 絕對唔可以用 split('') 或 text.slice() —— 佢哋切嘅係 UTF-16 code unit，
   *    emoji／生僻字會被拆爛，之後所有詞 offset 全部錯位（幽靈 bug）。
   */
  _chars(text) {
    return Array.from(text || '');
  },

  /**
   * 校驗老師標嘅詞。回傳每個詞嘅有效狀態同失效原因。
   * @param {string} text
   * @param {Array<{start:number,len:number,text:string}>} words
   * @returns {Array<{word:object, valid:boolean, reason:string|null}>}
   */
  validate(text, words) {
    const chars = this._chars(text);
    const list = Array.isArray(words) ? words : [];
    const covered = new Array(chars.length).fill(false);
    const out = [];

    for (const w of list) {
      const reason = this._rejectReason(chars, w);
      if (reason) { out.push({ word: w, valid: false, reason }); continue; }

      // 重疊檢查：先嚟嘅詞贏，後嚟嗰個降級
      let overlap = false;
      for (let i = w.start; i < w.start + w.len; i++) {
        if (covered[i]) { overlap = true; break; }
      }
      if (overlap) { out.push({ word: w, valid: false, reason: 'overlap' }); continue; }

      for (let i = w.start; i < w.start + w.len; i++) covered[i] = true;
      out.push({ word: w, valid: true, reason: null });
    }
    return out;
  },

  /** 單獨一個詞點解無效（null = 有效） */
  _rejectReason(chars, w) {
    if (!w || typeof w !== 'object') return 'invalid-params';
    const { start, len, text } = w;
    if (!Number.isInteger(start) || !Number.isInteger(len) || start < 0 || len < 1) return 'invalid-params';
    if (start + len > chars.length) return 'out-of-range';
    if (chars.slice(start, start + len).join('') !== text) return 'offset-mismatch';
    for (const ch of chars.slice(start, start + len)) {
      if (Tokenizer.PUNCT.has(ch)) return 'contains-punctuation';
    }
    return null;
  },

  /**
   * text + words → token 陣列。
   * 失效嘅詞會降級成普通單字 token（學生端照樣讀得通），同時喺 invalid 列出嚟俾老師端標示。
   * @returns {{tokens: Array<{type:'c'|'w'|'p', text:string, start:number, len:number, chars:string[]}>,
   *            invalid: Array<{word:object, valid:false, reason:string}>}}
   */
  tokenize(text, words) {
    const chars = this._chars(text);
    const checks = this.validate(text, words);

    // 有效詞 → start index 對照表
    const wordAt = new Map();
    for (const c of checks) {
      if (c.valid) wordAt.set(c.word.start, c.word);
    }

    const tokens = [];
    let i = 0;
    while (i < chars.length) {
      const w = wordAt.get(i);
      if (w) {
        const slice = chars.slice(i, i + w.len);
        tokens.push({ type: 'w', text: slice.join(''), start: i, len: w.len, chars: slice });
        i += w.len;
        continue;
      }
      const ch = chars[i];
      const type = Tokenizer.PUNCT.has(ch) ? 'p' : 'c';
      tokens.push({ type, text: ch, start: i, len: 1, chars: [ch] });
      i += 1;
    }

    return { tokens, invalid: checks.filter(c => !c.valid) };
  },
};

// ==================== SEQUENCE ====================
// 串行播放（🔊 讀全篇）：逐個 token 讀，每個讀完先讀下一個。
// 設計依據：docs/DESIGN.md §5.4
//
// ⚠️ 三條鐵律（唔好改）：
//   1. 推進**必須**靠 Voice.speak() 嘅完成回調（見 Voice.speak 入面註解），
//      唔可以用 setTimeout 估字長 —— 中文字長唔同，估一定 out-of-sync。
//   2. 標點唔送入 TTS（會讀出「逗號」「句號」），只做停頓。
//   3. 每次新一輪遞增 _gen；所有回調先檢查 gen === _gen，
//      否則 cancel() 觸發嘅 onerror('interrupted') 會令中斷後繼續讀落去（DESIGN §5.5.2 T8）。
const Sequence = {
  // 標點停頓（毫秒）：句號停耐啲，畀學生跟讀一次
  PAUSE_COMMA: 220,
  PAUSE_SENTENCE: 700,
  // token 之間嘅間隙
  GAP: 90,
  // 讀完嘅鼓勵語
  ENCOURAGE: '叻叻',

  state: 'idle',          // idle | playing
  _gen: 0,                // generation counter
  _index: -1,
  _tokens: [],
  _timer: null,
  _onActive: null,
  _onDone: null,
  _rate: undefined,

  isPlaying() { return this.state === 'playing'; },

  /**
   * 開始串行播放。
   * @param {Array} tokens Tokenizer 嘅 token 陣列
   * @param {object} opts { onActive(index, token), onDone(encourageText), rate }
   */
  play(tokens, opts = {}) {
    this.stop();
    this._tokens = Array.isArray(tokens) ? tokens : [];
    this._onActive = typeof opts.onActive === 'function' ? opts.onActive : null;
    this._onDone = typeof opts.onDone === 'function' ? opts.onDone : null;
    this._rate = typeof opts.rate === 'number' ? opts.rate : undefined;
    this._gen++;
    this._index = -1;
    this.state = 'playing';
    this._next();
  },

  /** 中斷：作廢所有回調 + cancel 語音 */
  stop() {
    this._gen++;
    this.state = 'idle';
    this._index = -1;
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    this._onActive = null;
    this._onDone = null;
    Voice.stop();
  },

  _next() {
    const gen = this._gen;
    this._index++;
    const idx = this._index;
    if (idx >= this._tokens.length) { this._finish(gen); return; }

    const token = this._tokens[idx];
    if (this._onActive) this._onActive(idx, token);

    if (token.type === 'p') {
      // 標點：唔讀，只停頓
      this._timer = setTimeout(() => {
        this._timer = null;
        if (gen !== this._gen) return;
        this._next();
      }, this._pauseFor(token.text));
      return;
    }

    Voice.speak(token.text, {
      rate: this._rate,
      // 完成回調係唯一嘅推進來源（出錯時 Voice 內部亦會呼叫佢，唔會卡死）
      onend: () => { this._afterSpeech(gen); },
    });
  },

  _afterSpeech(gen) {
    if (gen !== this._gen) return;
    this._timer = setTimeout(() => {
      this._timer = null;
      if (gen !== this._gen) return;
      this._next();
    }, Sequence.GAP);
  },

  _finish(gen) {
    if (gen !== this._gen) return;
    this.state = 'idle';
    this._index = -1;
    const encourage = Sequence.ENCOURAGE;
    if (encourage) Voice.speak(encourage, { rate: this._rate });
    if (this._onDone) this._onDone(encourage);
  },

  _pauseFor(ch) {
    return /[。！？…]/.test(ch) ? Sequence.PAUSE_SENTENCE : Sequence.PAUSE_COMMA;
  },
};

// ==================== READER ====================
// 學生端：渲染文章 + 處理點擊 + 放大高亮
// 設計依據：docs/DESIGN.md §5.2 / §5.3 / §5.5.3
//
// ⚠️ 三條規則：
//   1. 放大靠 CSS class（transform: scale），唔好喺 JS 改 style.fontSize —— 會重排。
//   2. **以詞為單位發音、以字為單位視覺**：撳單字若屬於某個詞，就讀整個詞
//      （TTS 靠 context 消歧，多音字先讀得準），視覺上只係嗰個字最深。
//   3. 標點唔讀。
const Reader = {
  _container: null,
  _tokens: [],
  _els: [],          // 每個 token 嘅 DOM
  _chars: [],        // 每個字嘅 DOM（扁平）
  _ranges: [],       // 每個 token 嘅字範圍 { from, to }

  /**
   * 渲染文章。
   * @param {HTMLElement} container 閱讀區容器
   * @param {Array} tokens Tokenizer 嘅 token 陣列
   */
  render(container, tokens) {
    this._container = container;
    this._tokens = Array.isArray(tokens) ? tokens : [];
    this._els = [];
    this._chars = [];
    this._ranges = [];
    container.innerHTML = '';

    this._tokens.forEach((token, ti) => {
      const tokEl = document.createElement('span');
      tokEl.className = 'tok' + (token.type === 'w' ? ' word' : '') + (token.type === 'p' ? ' punct' : '');
      tokEl.dataset.i = String(ti);
      tokEl.dataset.type = token.type;

      const from = this._chars.length;
      token.chars.forEach(ch => {
        const g = document.createElement('span');
        g.className = 'g';
        g.textContent = ch;
        g.dataset.ci = String(this._chars.length);
        tokEl.appendChild(g);
        this._chars.push({ el: g, tokenIndex: ti, charIndex: this._chars.length - from, charPos: token.start + (this._chars.length - from) });
      });
      this._ranges.push({ from, to: this._chars.length });

      container.appendChild(tokEl);
      this._els.push(tokEl);
    });

    container.addEventListener('click', (e) => this._onClick(e));
    return this._els;
  },

  _onClick(e) {
    const g = (e.target && e.target.closest) ? e.target.closest('.g') : null;
    if (!g || !this._container || !this._container.contains(g)) return;
    if (e.cancelable) e.preventDefault();
    this.activateChar(Number(g.dataset.ci));
  },

  /**
   * 啟動一個字。
   * @returns {{speakText:string, tokenIndex:number}|null}
   */
  activateChar(ci) {
    const info = this._chars[ci];
    if (!info) return null;
    const token = this._tokens[info.tokenIndex];
    if (!token || token.type === 'p') return null;      // 標點唔讀

    // 學生亂撳 → 停低串行朗讀，避免兩個聲音黐埋
    if (Sequence.isPlaying()) Sequence.stop();

    const wordPriority = !!Store.settings.wordPriority;
    let speakText = token.text;
    let wholeToken = true;
    let unitFrom = this._ranges[info.tokenIndex].from;
    let unitTo = this._ranges[info.tokenIndex].to;

    if (token.type === 'w' && !wordPriority) {
      // 單字優先：淨係讀撳嗰個字
      speakText = token.chars[info.charIndex];
      wholeToken = false;
      unitFrom = ci;
      unitTo = ci + 1;
    }

    this._clearActive();
    if (wholeToken) this._els[info.tokenIndex].classList.add('on');
    for (let i = unitFrom; i < unitTo; i++) this._chars[i].el.classList.add('on');
    this._chars[ci].el.classList.add('deep');

    Voice.speak(speakText, { rate: Store.settings.rate });
    this._showCard(speakText);
    return { speakText, tokenIndex: info.tokenIndex };
  },

  /** 串行朗讀時高亮某個 token */
  highlightToken(tokenIndex) {
    this._clearActive();
    const el = this._els[tokenIndex];
    const range = this._ranges[tokenIndex];
    if (!el || !range) return;
    el.classList.add('on');
    for (let i = range.from; i < range.to; i++) this._chars[i].el.classList.add('on');
  },

  clearActive() { this._clearActive(); },

  _clearActive() {
    for (const el of this._els) el.classList.remove('on');
    for (const c of this._chars) c.el.classList.remove('on', 'deep');
  },

  /**
   * 確保「讀音小卡」存在（單一真相來源：App 同測試都靠佢）。
   * @param {HTMLElement} host 卡片放邊度
   * @param {HTMLElement} before 插喺呢個元素之前（可唔填）
   */
  ensureCard(host, before) {
    let card = document.getElementById('read-card');
    if (card) return card;
    card = document.createElement('div');
    card.id = 'read-card';
    card.hidden = true;
    const label = document.createElement('span');
    label.textContent = '讀音：';
    const val = document.createElement('span');
    val.id = 'read-card-text';
    card.appendChild(label);
    card.appendChild(val);
    const parent = host || document.body;
    if (before && before.parentNode === parent) parent.insertBefore(card, before);
    else parent.appendChild(card);
    return card;
  },

  /** 讀音小卡：令學生知道電腦讀嘅係邊個詞（避免「聽到詞、見到字」嘅困惑） */
  _showCard(text) {
    const host = (this._container && this._container.parentNode) ? this._container.parentNode : null;
    const card = Reader.ensureCard(host);
    const label = document.getElementById('read-card-text');
    if (!label) return;
    label.textContent = text;
    card.hidden = false;
  },
};

// ==================== TOAST ====================
// 輕量提示。⚠️ 唔可以用 alert() —— SEN 原則（學生畫面唔可以有原生彈窗）
const Toast = {
  _el: null,
  _timer: null,

  show(message, ms = 2800) {
    const el = Toast._ensure();
    el.textContent = message;
    el.hidden = false;
    if (Toast._timer) { clearTimeout(Toast._timer); Toast._timer = null; }
    Toast._timer = setTimeout(() => { el.hidden = true; Toast._timer = null; }, ms);
    return el;
  },

  hide() {
    if (Toast._timer) { clearTimeout(Toast._timer); Toast._timer = null; }
    const el = Toast._ensure();
    el.hidden = true;
  },

  _ensure() {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.hidden = true;
      document.body.appendChild(el);
    }
    return el;
  },
};

// ==================== MODAL ====================
// in-app 確認框。⚠️ 唔可以用 confirm() —— SEN 原則
const Modal = {
  _el: null,

  askConfirm({ title, message, okText = '好', cancelText = '取消' } = {}) {
    const el = Modal._ensure();
    el.querySelector('.modal-title').textContent = title || '請確認';
    const msg = el.querySelector('.modal-message');
    msg.textContent = message || '';
    msg.hidden = false;
    const ok = el.querySelector('.modal-ok');
    const cancel = el.querySelector('.modal-cancel');
    ok.textContent = okText;
    cancel.textContent = cancelText;
    // ⚠️ 如果之前用過 askText，輸入框要收埋（否則會出現一個冇用嘅輸入框）
    const stale = el.querySelector('.modal-input');
    if (stale) stale.hidden = true;
    el.hidden = false;

    return new Promise(resolve => {
      const done = (val) => {
        el.hidden = true;
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        resolve(val);
      };
      const onOk = () => done(true);
      const onCancel = () => done(false);
      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
    });
  },

  /**
   * in-app 文字／密碼輸入框。
   * ⚠️ 唔可以用原生 prompt()（SEN 原則 + 靜態守門 S19）。
   * @returns {Promise<string|null>} 取消 = null
   */
  askText({ title, label, placeholder = '', password = false, okText = '好', cancelText = '取消' } = {}) {
    const el = Modal._ensure();
    el.querySelector('.modal-title').textContent = title || '請輸入';
    const msg = el.querySelector('.modal-message');
    msg.textContent = label || '';
    msg.hidden = !label;

    const input = Modal._input();
    input.type = password ? 'password' : 'text';
    input.value = '';
    input.placeholder = placeholder;
    // ⚠️ 一定要有可讀名（axe 嘅 label 規則係 critical）—— 用 label 文字，冇就用 placeholder
    input.setAttribute('aria-label', label || placeholder || '輸入');
    input.hidden = false;

    const ok = el.querySelector('.modal-ok');
    const cancel = el.querySelector('.modal-cancel');
    ok.textContent = okText;
    cancel.textContent = cancelText;
    el.hidden = false;
    try { input.focus(); } catch (e) { /* 冇 focus 唔要緊 */ }

    return new Promise(resolve => {
      const done = (val) => {
        el.hidden = true;
        input.hidden = true;
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        input.removeEventListener('keydown', onKey);
        resolve(val);
      };
      const onOk = () => done(input.value);
      const onCancel = () => done(null);
      const onKey = (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); onOk(); }
        else if (ev.key === 'Escape') { ev.preventDefault(); onCancel(); }
      };
      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
      input.addEventListener('keydown', onKey);
    });
  },

  /** 攞（必要時建立）modal 入面嘅輸入框 */
  _input() {
    const el = Modal._ensure();
    let input = el.querySelector('.modal-input');
    if (!input) {
      input = document.createElement('input');
      input.className = 'modal-input';
      input.type = 'text';
      input.hidden = true;
      const actions = el.querySelector('.modal-actions');
      el.querySelector('.modal-box').insertBefore(input, actions);
    }
    return input;
  },

  _ensure() {
    let el = document.getElementById('modal');
    if (!el) {
      el = document.createElement('div');
      el.id = 'modal';
      el.className = 'modal';
      el.hidden = true;
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      // ⚠️ dialog 一定要有 accessible name（axe aria-dialog-name = serious）→ 指向標題
      el.setAttribute('aria-labelledby', 'modal-title');
      el.innerHTML =
        '<div class="modal-box">' +
        '<h2 class="modal-title" id="modal-title"></h2>' +
        '<p class="modal-message"></p>' +
        '<div class="modal-actions">' +
        '<button type="button" class="modal-cancel">取消</button>' +
        '<button type="button" class="modal-ok">好</button>' +
        '</div></div>';
      document.body.appendChild(el);
    }
    return el;
  },
};

// ==================== TEACHER ====================
// 老師端：文章 CRUD + 標詞配對（撳兩個相鄰嘅字組成一個詞）
// 設計依據：docs/DESIGN.md §6
//
// ⚠️ 組詞規則：
//   1. 兩個字必須相鄰
//   2. 已經屬於另一個詞嘅字唔可以再配對
//   3. 標點唔可以組詞
//   4. 詞長 2–4 字；>4 字要二次確認（防止手滑連按）
const Teacher = {
  _chars: [],
  _words: [],           // 有效嘅詞 [{ start, len, text }]
  _invalid: [],         // 失效嘅詞 [{ word, reason }]（文章改咗）
  _pending: null,       // 已揀第一個字嘅位置
  _selectedWord: -1,
  _extending: -1,       // 正在「延長」嘅詞（-1 = 冇）
  _container: null,
  _hintEl: null,
  _textEl: null,
  _warnEl: null,
  _panelEl: null,
  _listEl: null,
  _onChange: null,

  /**
   * 進入標詞模式。
   * @param {HTMLElement} container
   * @param {string} text 文章正文
   * @param {Array} words 已組嘅詞
   * @param {object} opts { onChange(words) }
   */
  begin(container, text, words, opts = {}) {
    this._container = container;
    this._onChange = typeof opts.onChange === 'function' ? opts.onChange : null;
    container.innerHTML = '';

    this._hintEl = this._mk('div', 'teacher-hint', container);
    this._textEl = this._mk('div', 'reading teacher-text', container);
    this._warnEl = this._mk('div', 'teacher-warn', container);
    this._panelEl = this._mk('div', 'teacher-panel', container);
    this._listEl = this._mk('div', 'teacher-words', container);

    this._chars = Array.from(text || '');
    const checks = Tokenizer.validate(this._chars.join(''), words);
    this._words = checks.filter(c => c.valid).map(c => ({ start: c.word.start, len: c.word.len, text: c.word.text }));
    this._invalid = checks.filter(c => !c.valid).map(c => ({ word: c.word, reason: c.reason }));
    this._pending = null;
    this._selectedWord = -1;
    this._extending = -1;

    this._textEl.addEventListener('click', (e) => this._onClick(e));
    this.render();
  },

  _mk(tag, cls, parent) {
    const el = document.createElement(tag);
    el.className = cls;
    parent.appendChild(el);
    return el;
  },

  render() {
    if (!this._textEl) return;
    this._textEl.innerHTML = '';

    const wordByStart = new Map();
    this._words.forEach((w, wi) => wordByStart.set(w.start, wi));
    const used = new Array(this._chars.length).fill(false);

    for (let i = 0; i < this._chars.length; i++) {
      if (used[i]) continue;
      const wi = wordByStart.get(i);
      if (wi !== undefined) {
        const w = this._words[wi];
        const wordEl = document.createElement('span');
        wordEl.className = 't-word';
        wordEl.dataset.w = String(wi);
        for (let k = 0; k < w.len && i + k < this._chars.length; k++) {
          wordEl.appendChild(this._mkChar(i + k, false));
          used[i + k] = true;
        }
        this._textEl.appendChild(wordEl);
      } else {
        this._textEl.appendChild(this._mkChar(i, true));
        used[i] = true;
      }
    }

    this._renderHint();
    this._renderWarn();
    this._renderPanel();
    this._renderList();
  },

  _mkChar(pos, standalone) {
    const g = document.createElement('span');
    const ch = this._chars[pos];
    let cls = 't-char';
    if (Tokenizer.PUNCT.has(ch)) cls += ' punct';
    if (standalone && this._pending === pos) cls += ' pending';
    g.className = cls;
    g.dataset.pos = String(pos);
    g.textContent = ch;
    return g;
  },

  _onClick(e) {
    const charEl = (e.target && e.target.closest) ? e.target.closest('.t-char') : null;
    if (!charEl || !this._textEl.contains(charEl)) return;
    if (e.cancelable) e.preventDefault();
    const pos = Number(charEl.dataset.pos);
    const wordEl = charEl.closest('.t-word');

    if (wordEl) {
      const wi = Number(wordEl.dataset.w);
      if (this._pending !== null) {
        // 已經揀咗第一個字 → 拒絕（呢個字已經喺另一個詞入面）
        this._pending = null;
        this._extending = -1;
        Toast.show(`呢個字已經喺「${this._words[wi].text}」入面㗎`);
        this.render();
        return;
      }
      this._selectWord(wi);
      return;
    }
    this._pickChar(pos);
  },

  _pickChar(pos) {
    const ch = this._chars[pos];
    if (ch === undefined) return;

    if (Tokenizer.PUNCT.has(ch)) {
      Toast.show('標點唔可以組詞');
      this.render();
      return;
    }
    // 延長模式：撳詞旁邊嘅字 → 延長嗰個詞
    if (this._extending >= 0) {
      const wi = this._extending;
      this._extending = -1;
      if (this._adjacentWord(pos) === wi) { this._extendWord(wi, pos); return; }
      Toast.show('要撳詞旁邊嘅字先可以延長');
      this.render();
      return;
    }
    if (this._pending === null) {
      this._pending = pos;
      this.render();
      return;
    }
    if (this._pending === pos) {
      this._pending = null;          // 撳多次同一個字 = 取消
      this.render();
      return;
    }

    const a = this._pending;
    this._pending = null;
    if (Math.abs(a - pos) !== 1) {
      Toast.show('要揀相鄰嘅字㗎');
      this.render();
      return;
    }

    const start = Math.min(a, pos);
    const len = Math.abs(a - pos) + 1;
    const text = this._chars.slice(start, start + len).join('');

    if (len > 4) {
      // 詞太長 → 二次確認（防止手滑連按）
      Modal.askConfirm({
        title: '組個長詞？',
        message: `「${text}」有 ${len} 個字，會當成一個詞讀。確定？`,
        okText: '確定',
        cancelText: '取消',
      }).then(ok => {
        if (ok) this._addWord(start, len, text);
        else this.render();
      });
      this.render();
      return;
    }

    this._addWord(start, len, text);
  },

  /** 搵出 pos 旁邊（相鄰）嘅詞；冇就 -1 */
  _adjacentWord(pos) {
    for (let wi = 0; wi < this._words.length; wi++) {
      const w = this._words[wi];
      if (w.start === pos + 1 || w.start + w.len === pos) return wi;
    }
    return -1;
  },

  /** 延長一個詞（>4 字要二次確認） */
  _extendWord(wi, pos) {
    const w = this._words[wi];
    const start = Math.min(w.start, pos);
    const end = Math.max(w.start + w.len, pos + 1);
    const len = end - start;
    const text = this._chars.slice(start, end).join('');
    if (len > 4) {
      Modal.askConfirm({
        title: '組個長詞？',
        message: `「${text}」有 ${len} 個字，會當成一個詞讀。確定？`,
        okText: '確定',
        cancelText: '取消',
      }).then(ok => {
        if (ok) this._setWord(wi, start, len, text);
        else this.render();
      });
      this.render();
      return;
    }
    this._setWord(wi, start, len, text);
  },

  _setWord(wi, start, len, text) {
    this._words[wi] = { start, len, text };
    this._words.sort((x, y) => x.start - y.start);
    this._selectedWord = -1;
    this.render();
    if (this._onChange) this._onChange(this.getWords());
  },

  _addWord(start, len, text) {
    this._words.push({ start, len, text });
    this._words.sort((x, y) => x.start - y.start);
    this._selectedWord = -1;
    this.render();
    if (this._onChange) this._onChange(this.getWords());
  },

  _selectWord(wi) {
    this._selectedWord = wi;
    this._pending = null;
    this.render();
  },

  removeWord(wi) {
    if (wi < 0 || wi >= this._words.length) return;
    const removed = this._words.splice(wi, 1)[0];
    this._selectedWord = -1;
    this._extending = -1;
    Toast.show(`已取消合併「${removed.text}」`);
    this.render();
    if (this._onChange) this._onChange(this.getWords());
  },

  /** 拆開全部詞 */
  splitAll() {
    if (!this._words.length) {
      Toast.show('而家冇任何詞');
      return;
    }
    const n = this._words.length;
    this._words = [];
    this._selectedWord = -1;
    this._extending = -1;
    Toast.show(`已拆開 ${n} 個詞`);
    this.render();
    if (this._onChange) this._onChange(this.getWords());
  },

  getWords() { return this._words.map(w => ({ start: w.start, len: w.len, text: w.text })); },
  getInvalid() { return this._invalid.map(i => ({ word: i.word, reason: i.reason })); },

  _renderHint() {
    if (!this._hintEl) return;
    if (this._extending >= 0) {
      this._hintEl.textContent = `撳「${this._words[this._extending].text}」旁邊嘅字，就可以延長個詞。`;
    } else if (this._pending !== null) {
      this._hintEl.textContent = '再撳第 2 個字，組成一個詞（撳多次同一個字可以取消）';
    } else if (this._selectedWord >= 0) {
      this._hintEl.textContent = '撳返下面個詞，或者撳「✂️ 取消合併」。';
    } else {
      this._hintEl.textContent = '撳一個字，再撳相鄰嘅第二個字，就會變成一個詞。';
    }
  },

  _renderWarn() {
    if (!this._warnEl) return;
    if (!this._invalid.length) {
      this._warnEl.hidden = true;
      this._warnEl.textContent = '';
      return;
    }
    this._warnEl.hidden = false;
    const reasons = this._invalid.map(i => Tokenizer.REASON_TEXT[i.reason] || i.reason);
    this._warnEl.textContent = `⚠️ 有 ${this._invalid.length} 個詞要重新配對：${reasons.join('；')}`;
  },

  _renderPanel() {
    if (!this._panelEl) return;
    if (this._selectedWord < 0 || !this._words[this._selectedWord]) {
      this._panelEl.hidden = true;
      this._panelEl.innerHTML = '';
      return;
    }
    const w = this._words[this._selectedWord];
    this._panelEl.hidden = false;
    this._panelEl.innerHTML = '';
    const label = document.createElement('span');
    label.textContent = `詞：${w.text}`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'word-del';
    btn.textContent = '✂️ 取消合併';
    btn.addEventListener('click', () => this.removeWord(this._selectedWord));
    const ext = document.createElement('button');
    ext.type = 'button';
    ext.className = 'word-ext';
    ext.textContent = this._extending === this._selectedWord ? '← 撳詞旁邊嘅字' : '➕ 延長一字';
    ext.addEventListener('click', () => {
      this._extending = this._extending === this._selectedWord ? -1 : this._selectedWord;
      this.render();
    });
    this._panelEl.appendChild(label);
    this._panelEl.appendChild(btn);
    this._panelEl.appendChild(ext);
  },

  _renderList() {
    if (!this._listEl) return;
    this._listEl.innerHTML = '';
    if (!this._words.length) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = '仲未組任何詞。';
      this._listEl.appendChild(p);
      return;
    }
    this._words.forEach((w, wi) => {
      const row = document.createElement('div');
      row.className = 'word-row';
      const label = document.createElement('span');
      label.className = 'word-text';
      label.textContent = w.text;
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'word-del';
      del.textContent = '✂️';
      // ⚠️ 用 title 而唔係 aria-label（aria-label 會同可見文字「✂️」打架 → axe 違規）
      del.title = `刪除詞 ${w.text}`;
      del.addEventListener('click', () => this.removeWord(wi));
      row.appendChild(label);
      row.appendChild(del);
      this._listEl.appendChild(row);
    });
  },

  // ==================== 文章 CRUD ====================

  createArticle({ title, text, type = 'life' } = {}) {
    const article = {
      id: 'a_' + Math.random().toString(36).slice(2, 10),
      title: title || '未命名',
      type,
      text: text || '',
      words: [],
      createdAt: new Date().toISOString(),
      published: true,
    };
    Store.addArticle(article);
    return article;
  },

  saveArticle(article) {
    const list = Store.getArticles();
    const i = list.findIndex(a => a.id === article.id);
    if (i >= 0) list[i] = article; else list.push(article);
    Store.saveArticles(list);
    return article;
  },

  deleteArticle(id) {
    Store.removeArticle(id);
  },

  exportJSON() {
    return JSON.stringify(Store.getArticles(), null, 2);
  },

  importJSON(text) {
    let list;
    try {
      list = JSON.parse(text);
    } catch (e) {
      return { ok: false, error: '唔係有效嘅 JSON' };
    }
    if (!Array.isArray(list)) return { ok: false, error: '格式唔啱：應該係一個文章陣列' };
    const clean = list
      .filter(a => a && typeof a.text === 'string')
      .map(a => ({
        id: a.id || ('a_' + Math.random().toString(36).slice(2, 10)),
        title: a.title || '未命名',
        type: a.type || 'life',
        text: a.text,
        words: Array.isArray(a.words) ? a.words : [],
        createdAt: a.createdAt || new Date().toISOString(),
        published: a.published !== false,
      }));
    Store.saveArticles(clean);
    return { ok: true, count: clean.length };
  },
};


// ==================== HUB ====================
// 學生端首頁：揀文章。
// ⚠️ 學生**只可以**見到 published 嘅文章（老師可以隱藏未準備好嘅文章）。
const Hub = {
  TYPE_LABEL: { life: '生活', prose: '散文', poem: '詩歌' },

  render(container) {
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'hub';
    wrap.id = 'hub';

    const articles = Store.getArticles().filter(a => a.published !== false);

    if (!articles.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '暫時未有文章。請老師喺老師模式加一篇文章。';
      wrap.appendChild(empty);
    } else {
      for (const a of articles) wrap.appendChild(Hub._card(a));
    }

    const foot = document.createElement('div');
    foot.className = 'hub-foot';
    const teacherBtn = document.createElement('button');
    teacherBtn.type = 'button';
    teacherBtn.className = 'btn-ghost';
    teacherBtn.id = 'btn-teacher';
    teacherBtn.textContent = '⚙️ 老師模式';
    teacherBtn.addEventListener('click', () => App.enterTeacher());
    foot.appendChild(teacherBtn);
    wrap.appendChild(foot);

    container.appendChild(wrap);
    return wrap;
  },

  _card(a) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'article-card';
    card.dataset.id = a.id;
    // ⚠️ 唔好喺有可見文字嘅元素上加 aria-label：
    //    axe 嘅 label-content-name-mismatch 規則會要求「可見文字 ⊆ accessible name」，
    //    而卡片嘅可見文字仲包括類型同讀咗幾多次 → 加咗反而會 serious 違規。
    //    → 淨係靠可見文字做名（讀出嚟係「去茶餐廳 生活 讀咗 3 次」，已經夠清楚）。

    const title = document.createElement('span');
    title.className = 't-title';
    title.textContent = a.title || '未命名';

    const meta = document.createElement('span');
    meta.className = 't-meta';
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = Hub.TYPE_LABEL[a.type] || a.type || '文章';
    meta.appendChild(badge);
    const reads = (Store.getProgress()[a.id] || {}).reads || 0;
    meta.appendChild(document.createTextNode(`　讀咗 ${reads} 次`));

    card.appendChild(title);
    card.appendChild(meta);
    card.addEventListener('click', () => App.openArticle(a.id));
    return card;
  },
};

// ==================== TEACHER UI ====================
// 老師端畫面：文章庫 / 設定 / 標詞編輯。
// ⚠️ 標詞編輯係**獨立畫面**（唔係 tab）—— 切走會遺失未儲存嘅標詞。
const TeacherUI = {
  _tab: 'articles',        // articles | settings
  _editing: null,          // { id, title, type, text, words }（id = null → 新文章）

  // ---------------- 主畫面 ----------------
  render(container) {
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.id = 'teacher';

    wrap.appendChild(TeacherUI._bar('老師模式', () => App.go('hub'), 'btn-teacher-back'));

    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    tabs.setAttribute('role', 'tablist');
    const defs = [
      { id: 'articles', label: '📚 文章庫' },
      { id: 'settings', label: '⚙️ 設定' },
    ];
    for (const d of defs) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn-ghost';
      b.id = 'tab-' + d.id;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(TeacherUI._tab === d.id));
      b.setAttribute('aria-controls', 'teacher-body');
      b.textContent = d.label;
      b.addEventListener('click', () => {
        TeacherUI._tab = d.id;
        TeacherUI._renderBody();
      });
      tabs.appendChild(b);
    }
    wrap.appendChild(tabs);

    const body = document.createElement('div');
    body.id = 'teacher-body';
    body.setAttribute('role', 'tabpanel');
    wrap.appendChild(body);
    container.appendChild(wrap);

    TeacherUI._renderBody();
    return wrap;
  },

  _bar(titleText, onBack, backId) {
    const bar = document.createElement('div');
    bar.className = 'topbar';
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'btn-ghost';
    back.id = backId;
    back.textContent = '⬅️ 返回';
    back.addEventListener('click', onBack);
    const title = document.createElement('span');
    title.className = 't-title';
    title.textContent = titleText;
    bar.appendChild(back);
    bar.appendChild(title);
    return bar;
  },

  _renderBody() {
    const body = document.getElementById('teacher-body');
    if (!body) return;
    body.innerHTML = '';
    if (TeacherUI._tab === 'articles') TeacherUI._renderArticles(body);
    else TeacherUI._renderSettings(body);
  },

  // ---------------- 文章庫 ----------------
  _renderArticles(body) {
    const top = document.createElement('div');
    top.className = 'card';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.id = 'btn-new-article';
    addBtn.textContent = '➕ 新文章';
    addBtn.addEventListener('click', () => {
      TeacherUI._editing = { id: null, title: '', type: 'life', text: '', words: [] };
      App.go('teacher-edit');
    });
    top.appendChild(addBtn);
    body.appendChild(top);

    const list = document.createElement('div');
    list.className = 'card';
    const articles = Store.getArticles();
    if (!articles.length) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = '仲未有文章。';
      list.appendChild(p);
    }
    for (const a of articles) list.appendChild(TeacherUI._row(a));
    body.appendChild(list);

    body.appendChild(TeacherUI._importExport());
  },

  _row(a) {
    const row = document.createElement('div');
    row.className = 'article-row';
    row.dataset.id = a.id;

    const title = document.createElement('span');
    title.className = 't-title';
    title.textContent = a.title || '未命名';

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = a.published === false ? '🚫 隱藏' : '👁 已發佈';

    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'btn-ghost';
    edit.textContent = '✏️ 標詞';
    // ⚠️ 用 title（tooltip）而唔係 aria-label —— aria-label 會同可見文字打架（axe）
    edit.title = `標詞：${a.title || '未命名'}`;
    edit.addEventListener('click', () => {
      TeacherUI._editing = {
        id: a.id,
        title: a.title || '',
        type: a.type || 'life',
        text: a.text || '',
        published: a.published !== false,
        words: Array.isArray(a.words)
          ? a.words.map(w => ({ start: w.start, len: w.len, text: w.text }))
          : [],
      };
      App.go('teacher-edit');
    });

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'btn-ghost';
    toggle.textContent = a.published === false ? '👁 發佈' : '🚫 隱藏';
    toggle.title = `${a.published === false ? '發佈' : '隱藏'}：${a.title || '未命名'}`;
    toggle.addEventListener('click', () => {
      const cur = Store.getArticle(a.id);
      if (!cur) return;
      cur.published = cur.published === false;
      Teacher.saveArticle(cur);
      TeacherUI._renderBody();
      Toast.show(cur.published ? '已發佈，學生見到喇' : '已隱藏，學生見唔到');
    });

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-danger';
    del.textContent = '🗑️ 刪除';
    del.title = `刪除：${a.title || '未命名'}`;
    del.addEventListener('click', async () => {
      const ok = await Modal.askConfirm({
        title: '刪除文章？',
        message: `「${a.title || '未命名'}」會被刪走，刪咗就返唔到㗎。`,
        okText: '刪除',
        cancelText: '取消',
      });
      if (!ok) return;
      Teacher.deleteArticle(a.id);
      TeacherUI._renderBody();
      Toast.show('已刪除');
    });

    row.appendChild(title);
    row.appendChild(badge);
    row.appendChild(edit);
    row.appendChild(toggle);
    row.appendChild(del);
    return row;
  },

  _importExport() {
    const card = document.createElement('div');
    card.className = 'card';

    const expBtn = document.createElement('button');
    expBtn.type = 'button';
    expBtn.id = 'btn-export';
    expBtn.className = 'btn-ghost';
    expBtn.textContent = '⬇️ 匯出文章';
    expBtn.addEventListener('click', () => {
      const json = Teacher.exportJSON();
      const ta = document.createElement('textarea');
      ta.id = 'export-json';
      ta.readOnly = true;
      ta.value = json;
      // ⚠️ textarea 一定要有 label（axe 嘅 label 規則 = critical）
      const taLabel = document.createElement('label');
      taLabel.setAttribute('for', 'export-json');
      taLabel.className = 'muted';
      taLabel.textContent = '匯出內容（長按可以複製）';
      const dl = document.createElement('button');
      dl.type = 'button';
      dl.id = 'btn-download';
      dl.textContent = '💾 下載 JSON 檔';
      dl.addEventListener('click', () => TeacherUI._download(json));
      card.insertBefore(taLabel, expBtn);
      card.insertBefore(ta, expBtn);
      card.insertBefore(dl, expBtn);
      Toast.show('JSON 已經喺下面，可以長按複製');
    });

    const impLabel = document.createElement('label');
    impLabel.setAttribute('for', 'import-json');
    impLabel.className = 'muted';
    impLabel.textContent = '匯入：將之前匯出嘅 JSON 貼落面';
    const ta = document.createElement('textarea');
    ta.id = 'import-json';
    ta.placeholder = '貼上 JSON';
    const impBtn = document.createElement('button');
    impBtn.type = 'button';
    impBtn.id = 'btn-import';
    impBtn.className = 'btn-ghost';
    impBtn.textContent = '⬆️ 匯入';
    impBtn.addEventListener('click', () => {
      const res = Teacher.importJSON(ta.value);
      if (!res.ok) { Toast.show(res.error || '匯入失敗'); return; }
      Toast.show(`已匯入 ${res.count} 篇文章`);
      TeacherUI._renderBody();
    });

    card.appendChild(expBtn);
    card.appendChild(impLabel);
    card.appendChild(ta);
    card.appendChild(impBtn);
    return card;
  },

  _download(json) {
    try {
      if (typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') {
        Toast.show('呢部裝置唔支援下載，請長按複製 JSON');
        return;
      }
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'chinese-reading-articles.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      Toast.show('已下載');
    } catch (e) {
      Toast.show('下載唔到，請長按複製 JSON');
    }
  },

  /** 套用字級（slider / 預設掣 共用同一個真相來源） */
  _applyFontScale(value, fsInput, fsVal) {
    const v = Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, Number(value) || 1));
    Store.settings.fontScale = v;
    Store.saveSettings();
    App.applyFontScale();
    if (fsInput) fsInput.value = String(v);
    if (fsVal) fsVal.textContent = Math.round(v * 100) + '%';
  },

  // ---------------- 設定 ----------------
  _renderSettings(body) {
    const card = document.createElement('div');
    card.className = 'card';

    const rate = document.createElement('div');
    rate.className = 'setting-row';
    const rateLab = document.createElement('label');
    rateLab.textContent = '語速';
    rateLab.setAttribute('for', 'set-rate');
    const rateInput = document.createElement('input');
    rateInput.type = 'range';
    rateInput.id = 'set-rate';
    rateInput.min = '0.5';
    rateInput.max = '1.2';
    rateInput.step = '0.05';
    rateInput.value = String(Store.settings.rate);
    const rateVal = document.createElement('span');
    rateVal.className = 'v';
    rateVal.id = 'set-rate-val';
    rateVal.textContent = Number(Store.settings.rate).toFixed(2) + '×';
    rateInput.addEventListener('input', () => {
      Store.settings.rate = Number(rateInput.value);
      Voice.rate = Store.settings.rate;
      rateVal.textContent = Number(rateInput.value).toFixed(2) + '×';
      Store.saveSettings();
    });
    rate.appendChild(rateLab);
    rate.appendChild(rateInput);
    rate.appendChild(rateVal);
    card.appendChild(rate);

    const fs = document.createElement('div');
    fs.className = 'setting-row';
    const fsLab = document.createElement('label');
    fsLab.textContent = '字級';
    fsLab.setAttribute('for', 'set-font');
    const fsInput = document.createElement('input');
    fsInput.type = 'range';
    fsInput.id = 'set-font';
    fsInput.min = String(FONT_SCALE_MIN);
    fsInput.max = String(FONT_SCALE_MAX);
    fsInput.step = String(FONT_SCALE_STEP);
    fsInput.value = String(Store.settings.fontScale);
    const fsVal = document.createElement('span');
    fsVal.className = 'v';
    fsVal.id = 'set-font-val';
    fsVal.textContent = Math.round((Number(Store.settings.fontScale) || 1) * 100) + '%';
    fsInput.addEventListener('input', () => {
      TeacherUI._applyFontScale(Number(fsInput.value), fsInput, fsVal);
    });
    fs.appendChild(fsLab);
    fs.appendChild(fsInput);
    fs.appendChild(fsVal);
    card.appendChild(fs);

    // 預設字級（一撳就跳到，唔使慢慢拖）
    const presets = document.createElement('div');
    presets.className = 'setting-row';
    const pLab = document.createElement('label');
    pLab.textContent = '快速字級';
    const pWrap = document.createElement('div');
    pWrap.className = 'btn-row';
    pWrap.id = 'font-presets';
    for (const preset of FONT_PRESETS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn-ghost';
      b.dataset.scale = String(preset.value);
      b.textContent = preset.label;
      b.title = `${preset.label}（${Math.round(preset.value * 100)}%）`;
      b.addEventListener('click', () => {
        TeacherUI._applyFontScale(preset.value, fsInput, fsVal);
        Toast.show(`字級：${preset.label}（${Math.round(preset.value * 100)}%）`);
      });
      pWrap.appendChild(b);
    }
    presets.appendChild(pLab);
    presets.appendChild(pWrap);
    card.appendChild(presets);

    const wp = document.createElement('div');
    wp.className = 'setting-row';
    const wpLab = document.createElement('label');
    wpLab.textContent = '詞優先';
    wpLab.setAttribute('for', 'set-word-priority');
    const wpCb = document.createElement('input');
    wpCb.type = 'checkbox';
    wpCb.id = 'set-word-priority';
    wpCb.checked = !!Store.settings.wordPriority;
    wpCb.addEventListener('change', () => {
      Store.settings.wordPriority = wpCb.checked;
      Store.saveSettings();
      Toast.show(wpCb.checked ? '已開：撳字會讀成整個詞' : '已關：撳字淨係讀嗰個字');
    });
    wp.appendChild(wpLab);
    wp.appendChild(wpCb);
    card.appendChild(wp);

    body.appendChild(card);

    // ---- 密碼 ----
    const pw = document.createElement('div');
    pw.className = 'card';
    const pwTitle = document.createElement('p');
    pwTitle.className = 't-title';
    pwTitle.textContent = '🔑 老師密碼';
    const pwBtn = document.createElement('button');
    pwBtn.type = 'button';
    pwBtn.id = 'btn-change-pass';
    pwBtn.className = 'btn-ghost';
    pwBtn.textContent = '更改密碼';
    pwBtn.addEventListener('click', async () => {
      const p1 = await Modal.askText({
        title: '更改密碼',
        label: `新密碼（最少 ${Auth.MIN_PASS_LEN} 個字元）`,
        password: true,
        okText: '下一步',
        cancelText: '取消',
      });
      if (p1 === null) return;
      const p2 = await Modal.askText({
        title: '更改密碼',
        label: '再輸入一次，確認係同一個',
        password: true,
        okText: '確定',
        cancelText: '取消',
      });
      if (p2 === null) return;
      if (p1 !== p2) { Toast.show('兩次輸入唔一樣'); return; }
      const res = Auth.changePassword(p1);
      Toast.show(res.ok ? '密碼已更新' : (res.error || '更新失敗'));
    });
    pw.appendChild(pwTitle);
    pw.appendChild(pwBtn);
    body.appendChild(pw);
  },

  // ---------------- 標詞編輯畫面 ----------------
  renderEditor(container) {
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.id = 'teacher-edit';
    const ed = TeacherUI._editing || { id: null, title: '', type: 'life', text: '', words: [] };

    wrap.appendChild(TeacherUI._bar(ed.id ? '編輯文章' : '新文章', () => TeacherUI._leaveEditor(), 'btn-edit-back'));

    const form = document.createElement('div');
    form.className = 'card';

    const titleLabel = document.createElement('label');
    titleLabel.textContent = '標題';
    titleLabel.setAttribute('for', 'edit-title');
    titleLabel.className = 'field-label';
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.id = 'edit-title';
    titleInput.value = ed.title || '';
    form.appendChild(titleLabel);
    form.appendChild(titleInput);

    const typeLabel = document.createElement('label');
    typeLabel.textContent = '類型';
    typeLabel.setAttribute('for', 'edit-type');
    typeLabel.className = 'field-label';
    const typeSel = document.createElement('select');
    typeSel.id = 'edit-type';
    const types = [['life', '生活'], ['prose', '散文'], ['poem', '詩歌']];
    for (const pair of types) {
      const o = document.createElement('option');
      o.value = pair[0];
      o.textContent = pair[1];
      if (ed.type === pair[0]) o.selected = true;
      typeSel.appendChild(o);
    }
    form.appendChild(typeLabel);
    form.appendChild(typeSel);

    const textLabel = document.createElement('label');
    textLabel.textContent = '文章內容';
    textLabel.setAttribute('for', 'edit-text');
    textLabel.className = 'field-label';
    const textarea = document.createElement('textarea');
    textarea.id = 'edit-text';
    textarea.value = ed.text || '';
    textarea.placeholder = '將文章貼落面（可以長按貼上）';
    form.appendChild(textLabel);
    form.appendChild(textarea);

    // 字數計數 + 貼上掣（老師即場輸入文章嘅主流程）
    const textTools = document.createElement('div');
    textTools.className = 'btn-row';
    const pasteBtn = document.createElement('button');
    pasteBtn.type = 'button';
    pasteBtn.id = 'btn-paste';
    pasteBtn.className = 'btn-ghost';
    pasteBtn.textContent = '📋 貼上';
    pasteBtn.title = '由剪貼簿貼上文章';
    const count = document.createElement('span');
    count.className = 'v';
    count.id = 'text-count';
    const updateCount = () => {
      const n = Array.from(textarea.value || '').length;   // code point 計數（emoji 當 1 個字）
      count.textContent = `${n} 字`;
    };
    textarea.addEventListener('input', updateCount);
    updateCount();
    pasteBtn.addEventListener('click', async () => {
      try {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          Toast.show('呢部裝置唔支援貼上，請長按輸入框貼上');
          return;
        }
        const text = await navigator.clipboard.readText();
        if (!text || !text.trim()) { Toast.show('剪貼簿係空嘅'); return; }
        textarea.value = text;
        updateCount();
        Toast.show(`已貼上 ${Array.from(text).length} 個字`);
      } catch (e) {
        Toast.show('讀唔到剪貼簿，請長按輸入框貼上');
      }
    });
    textTools.appendChild(pasteBtn);
    textTools.appendChild(count);
    form.appendChild(textTools);

    const startBtn = document.createElement('button');
    startBtn.type = 'button';
    startBtn.id = 'btn-start-marking';
    startBtn.textContent = ed.id ? '🔄 重新標詞' : '✨ 開始標詞';
    startBtn.addEventListener('click', () => {
      const text = textarea.value;
      if (!text || !text.trim()) { Toast.show('請先貼上文章內容'); return; }
      ed.text = text;
      ed.title = titleInput.value.trim() || '未命名';
      ed.type = typeSel.value;
      TeacherUI._editing = ed;
      const host = document.getElementById('mark-host');
      if (host) TeacherUI._renderMarking(host);
    });
    form.appendChild(startBtn);
    wrap.appendChild(form);

    const markHost = document.createElement('div');
    markHost.id = 'mark-host';
    wrap.appendChild(markHost);

    // 儲存掣**一直喺度**（唔使先開始標詞）—— 老師可以即場貼完文章就儲存
    const actionCard = document.createElement('div');
    actionCard.className = 'card';
    const row = document.createElement('div');
    row.className = 'btn-row';
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.id = 'btn-save-article';
    saveBtn.textContent = '💾 儲存文章';
    saveBtn.addEventListener('click', () => TeacherUI._save());
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn-ghost';
    cancelBtn.id = 'btn-cancel-edit';
    cancelBtn.textContent = '取消';
    cancelBtn.addEventListener('click', () => TeacherUI._leaveEditor());
    row.appendChild(saveBtn);
    row.appendChild(cancelBtn);
    actionCard.appendChild(row);
    wrap.appendChild(actionCard);

    container.appendChild(wrap);
    if (ed.text && ed.text.trim()) TeacherUI._renderMarking(markHost);
    return wrap;
  },

  _renderMarking(host) {
    host.innerHTML = '';
    const ed = TeacherUI._editing;
    if (!ed) return;

    const card = document.createElement('div');
    card.className = 'card';

    const hint = document.createElement('p');
    hint.className = 'muted';
    hint.textContent = '撳第一個字，再撳相鄰嘅第二個字，就會組成一個詞。3 字以上用「➕ 延長一字」。';
    card.appendChild(hint);

    const editor = document.createElement('div');
    editor.id = 'teacher-editor';
    card.appendChild(editor);

    host.appendChild(card);
    Teacher.begin(editor, ed.text, ed.words || []);
  },

  _save() {
    const ed = TeacherUI._editing;
    if (!ed) return;
    const titleEl = document.getElementById('edit-title');
    const typeEl = document.getElementById('edit-type');
    const textEl = document.getElementById('edit-text');
    if (titleEl) ed.title = titleEl.value.trim() || '未命名';
    if (typeEl) ed.type = typeEl.value;
    if (textEl) ed.text = textEl.value;

    // ⚠️ 冇內容唔應該儲存（會產生一篇空文章，學生撳落去乜都冇）
    if (!ed.text || !ed.text.trim()) {
      Toast.show('文章內容係空嘅，請先貼上文章');
      return;
    }

    const words = Teacher.getWords();
    let article = ed.id ? Store.getArticle(ed.id) : null;
    if (!article) {
      article = Teacher.createArticle({ title: ed.title, text: ed.text, type: ed.type });
    }
    article.title = ed.title;
    article.text = ed.text;
    article.type = ed.type;
    article.words = words;
    article.published = ed.published !== false;
    Teacher.saveArticle(article);

    // 話俾老師知有冇標詞（未標詞 = 學生會逐個字讀，唔會讀成詞）
    Toast.show(words.length ? `已儲存（${words.length} 個詞）` : '已儲存（未標詞，學生會逐個字讀）');
    TeacherUI._editing = null;
    TeacherUI._tab = 'articles';
    App.go('teacher');
  },

  async _leaveEditor() {
    const ed = TeacherUI._editing;
    if (ed) {
      const ok = await Modal.askConfirm({
        title: '唔儲存？',
        message: '你仲未儲存，離開咗就會唔見咗。確定？',
        okText: '唔儲存，返回',
        cancelText: '繼續編輯',
      });
      if (!ok) return;
    }
    TeacherUI._editing = null;
    TeacherUI._tab = 'articles';
    App.go('teacher');
  },
};

// ==================== APP ====================
let _initPromise = null;      // App.init() 冪等：harness 同 DOMContentLoaded 都會叫

const App = {
  view: 'hub',               // hub | read | teacher | teacher-edit
  articleId: null,

  init() {
    if (_initPromise) return _initPromise;
    _initPromise = (async () => {
      Store.load();
      Store.seedDefaults();                 // 第一次開 app 植入預設文章
      Voice.rate = Store.settings.rate;
      const state = await Voice.init();
      this.renderVoiceBanner(state);
      this.applyFontScale();
      this.go('hub');
      return state;
    })();
    return _initPromise;
  },

  applyFontScale() {
    const el = document.documentElement;
    if (el && el.style) el.style.setProperty('--font-scale', String(Store.settings.fontScale || 1));
  },

  renderVoiceBanner(state) {
    const el = document.getElementById('voice-banner');
    if (!el) return;
    if (state === 'ok') { el.hidden = true; el.removeAttribute('data-state'); el.textContent = ''; return; }
    el.hidden = false;
    el.setAttribute('data-state', state);
    el.textContent = state === 'unsupported'
      ? '❌ 呢個瀏覽器唔支援語音，請用 Safari 或 Chrome 開啟。'
      : '⚠️ 呢部裝置搵唔到廣東話語音，讀唔到。請聯絡老師。';
  },

  /** 切換畫面 */
  go(view) {
    if (Sequence.isPlaying()) Sequence.stop();
    this.view = view;
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = '';
    if (view === 'hub') Hub.render(app);
    else if (view === 'read') this.renderReader(app);
    else if (view === 'teacher') TeacherUI.render(app);
    else if (view === 'teacher-edit') TeacherUI.renderEditor(app);
    // 捲返上去（唔用 window.scrollTo —— jsdom 冇真正實作，會出 error）
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  },

  /** 學生撳一篇文章 */
  openArticle(id) {
    const a = Store.getArticle(id);
    if (!a) { Toast.show('搵唔到呢篇文章'); return; }
    this.articleId = id;
    Store.bumpProgress(id);
    this.go('read');
  },

  /** 老師模式（要密碼） */
  async enterTeacher() {
    const res = await Auth.askPassword('🔐 老師模式');
    if (res.cancelled) return;              // 取消 → 唔提示錯誤
    if (!res.ok) { Toast.show('密碼唔啱'); return; }
    TeacherUI._tab = 'articles';
    TeacherUI._editing = null;
    this.go('teacher');
  },

  /** 閱讀頁 */
  renderReader(app) {
    const a = Store.getArticle(this.articleId);
    const wrap = document.createElement('div');
    wrap.id = 'reader';

    if (!a) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = '搵唔到文章。';
      wrap.appendChild(p);
      app.appendChild(wrap);
      return wrap;
    }

    const bar = document.createElement('div');
    bar.className = 'topbar';
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'btn-ghost';
    back.id = 'btn-back';
    back.textContent = '⬅️ 返回';
    back.addEventListener('click', () => this.go('hub'));
    const title = document.createElement('span');
    title.className = 't-title';
    title.textContent = a.title || '未命名';
    bar.appendChild(back);
    bar.appendChild(title);
    wrap.appendChild(bar);

    const card = document.createElement('div');
    card.className = 'card';

    const area = document.createElement('div');
    area.id = 'reading-area';
    area.className = 'reading';
    card.appendChild(area);

    const toolbar = document.createElement('div');
    toolbar.className = 'toolbar';

    const btnAll = document.createElement('button');
    btnAll.type = 'button';
    btnAll.id = 'btn-read-all';
    btnAll.textContent = '🔊 讀全篇';

    const btnStop = document.createElement('button');
    btnStop.type = 'button';
    btnStop.id = 'btn-stop';
    btnStop.className = 'btn-ghost';
    btnStop.textContent = '⏹ 停';

    const btnMinus = document.createElement('button');
    btnMinus.type = 'button';
    btnMinus.id = 'btn-font-minus';
    btnMinus.className = 'btn-ghost';
    btnMinus.textContent = 'A−';

    const btnPlus = document.createElement('button');
    btnPlus.type = 'button';
    btnPlus.id = 'btn-font-plus';
    btnPlus.className = 'btn-ghost';
    btnPlus.textContent = 'A+';

    // 顯示目前字級（老師即場調嘅時候要見到大細）
    const fontLabel = document.createElement('span');
    fontLabel.className = 'v';
    fontLabel.id = 'font-scale-label';
    fontLabel.textContent = Math.round((Number(Store.settings.fontScale) || 1) * 100) + '%';

    toolbar.appendChild(btnAll);
    toolbar.appendChild(btnStop);
    toolbar.appendChild(btnMinus);
    toolbar.appendChild(fontLabel);
    toolbar.appendChild(btnPlus);
    card.appendChild(toolbar);

    // 讀音小卡放喺閱讀區同工具列之間（由 Reader 擁有 markup —— 單一真相來源）
    Reader.ensureCard(card, toolbar);

    wrap.appendChild(card);
    app.appendChild(wrap);

    const { tokens } = Tokenizer.tokenize(a.text, a.words || []);
    Reader.render(area, tokens);

    const resetBtn = () => { btnAll.textContent = '🔊 讀全篇'; };
    btnAll.addEventListener('click', () => {
      if (Sequence.isPlaying()) { Sequence.stop(); resetBtn(); return; }
      btnAll.textContent = '⏹ 停';
      Sequence.play(tokens, {
        onActive: (i) => Reader.highlightToken(i),
        onDone: () => { Reader.clearActive(); resetBtn(); },
      });
    });
    btnStop.addEventListener('click', () => { Sequence.stop(); resetBtn(); });
    btnMinus.addEventListener('click', () => this.changeFontScale(-FONT_SCALE_STEP));
    btnPlus.addEventListener('click', () => this.changeFontScale(FONT_SCALE_STEP));

    return wrap;
  },

  changeFontScale(delta) {
    const cur = Number(Store.settings.fontScale) || 1;
    // ⚠️ 細步（5%）：中度學生對字級好敏感，10% 一跳太多（大細差好多）
    const next = Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, Math.round((cur + delta) * 100) / 100));
    Store.settings.fontScale = next;
    Store.saveSettings();
    this.applyFontScale();
    const label = document.getElementById('font-scale-label');
    if (label) label.textContent = Math.round(next * 100) + '%';
  },
};

// harness 用：所有模組喺呢度匯出（docs/TEST-PLAN.md §2.3 C1）
window.CR = {
  App, Voice, Tokenizer, Sequence, Reader, Teacher, Toast, Modal, Store,
  Sha256, Auth, Hub, TeacherUI,
};

// 真實瀏覽器嘅啟動入口。
// harness 會直接叫 App.init()（jsdom 嘅 DOMContentLoaded 已經 fire 咗，唔會再 fire），
// 所以 App.init() 做成冪等 —— 兩邊都叫都冇問題。
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    App.init().catch(e => console.error('[chinese-reading] init failed', e));
  });
} else {
  App.init().catch(e => console.error('[chinese-reading] init failed', e));
}
</script>
